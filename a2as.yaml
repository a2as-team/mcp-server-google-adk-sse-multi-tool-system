functions:
  __init__:
    type: sync
    module: mcp_agent.mcp_agent.mcp_toolkit
    args: [self, mcp_server_url]
  _clean_repo_path:
    type: sync
    module: mcp_agent.mcp_agent.tools
    args: [repo_path]
    params:
      returns: str
  _sse_worker:
    type: sync
    module: mcp_agent.mcp_agent.mcp_toolkit
    args: [self, callback_function]
  analyze_repository:
    type: sync
    module: mcp_agent.mcp_agent.mcp_toolkit
    args: [self, repo_path]
    params:
      returns: Dict
  call_api:
    type: sync
    module: mcp_agent.mcp_agent.mcp_toolkit
    args: [self, endpoint, method, data, headers]
    params:
      returns: Dict
  clone_repository:
    type: sync
    module: mcp_agent.mcp_agent.mcp_toolkit
    args: [self, url]
    params:
      returns: Dict
  custom_status:
    type: async
    module: mcp_agent.main
  debug_gitlab_job:
    type: sync
    module: mcp_agent.mcp_agent.mcp_toolkit
    args: [self, job_id, project_id, job_url]
    params:
      returns: Dict
  delete_file:
    type: sync
    module: mcp_agent.mcp_agent.mcp_toolkit
    args: [self, file_path]
    params:
      returns: Dict
  execute_tool:
    type: sync
    module: mcp_agent.mcp_agent.mcp_toolkit
    args: [self, tool_name, parameters]
    params:
      returns: Dict
  format_terraform_resource:
    type: sync
    module: mcp_agent.mcp_agent.tools
    args: [resource_type, resource_name, attributes]
    params:
      returns: str
  format_terraform_value:
    type: sync
    module: mcp_agent.mcp_agent.tools
    args: [value]
    params:
      returns: str
  generate_readme:
    type: sync
    module: mcp_agent.mcp_agent.mcp_toolkit
    args: [self, repo_path]
    params:
      returns: Dict
  get_session_data:
    type: sync
    module: mcp_agent.mcp_agent.mcp_toolkit
    args: [self, key]
    params:
      returns: Dict
  get_toolkit:
    type: sync
    module: mcp_agent.mcp_agent.mcp_toolkit
    params:
      returns: MCPToolkit
  get_toolkit_with_retry:
    type: sync
    module: mcp_agent.mcp_agent.tools
    args: [max_retries, retry_delay]
  get_weather:
    type: sync
    module: mcp_agent.mcp_agent.mcp_toolkit
    args: [self, location]
    params:
      returns: Dict
  git_operation:
    type: sync
    module: mcp_agent.mcp_agent.mcp_toolkit
    args: [self, operation, repo_path]
    params:
      returns: Dict
  health_check:
    type: async
    module: mcp_agent.mcp_agent.main
  initialize_session:
    type: sync
    module: mcp_agent.mcp_agent.mcp_toolkit
    args: [self]
    params:

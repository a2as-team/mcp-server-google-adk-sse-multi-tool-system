variables:
  ALLOWED_ORIGINS:
    type: env
    params:
      caller: [os.environ.get]
      path: [mcp_agent.main, mcp_agent.mcp_agent.main]
  MCP_SERVER_URL:
    type: env
    params:
      caller: [os.environ.get]
      path: [mcp_agent.mcp_agent.mcp_toolkit]
  PORT:
    type: env
    params:
      caller: [os.getenv]
      path: [mcp_agent.main, mcp_agent.mcp_agent.main]
  SESSION_DB_URL:
    type: env
    params:
      caller: [os.environ.get]
      path: [mcp_agent.main, mcp_agent.mcp_agent.main]

files:
  file_name:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [relative_dir, file_name]
  file_path:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [repo_path, file_path]
  new_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.dirname, os.path.basename]
  relative_path:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [repo_full_path, relative_path]
  target_file:
    type: variable
    actions: [read]
    params:
      caller: [os.path.basename]
  target_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.dirname, os.path.basename]
